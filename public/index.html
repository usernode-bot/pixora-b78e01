<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>PIXORA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><path d='M50 24l6.2 16.8L73 47l-16.8 6.2L50 70l-6.2-16.8L27 47l16.8-6.2L50 24z' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. The main area follows
       the theme; the sidebar keeps its own fixed dark palette in both. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- Mobile backdrop behind the slide-in sidebar. -->
  <div id="backdrop" hidden class="fixed inset-0 z-30 bg-fg/60 md:hidden"></div>

  <div class="flex min-h-screen">
    <!-- Dark sidebar: the PIXORA wordmark (text, no logo yet), the tool
         navigation built from the registry in public/js/tools.js, and a
         one-line footer. Fixed and off-canvas on phones, sticky on desktop. -->
    <aside id="sidebar" aria-label="PIXORA navigation"
      class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-sb-line bg-sb-bg motion-safe:transition-transform motion-safe:duration-200 md:sticky md:top-0 md:h-screen md:translate-x-0">
      <!-- The wordmark row carries the "?" that reopens the getting-started
           guide at any time (see public/js/onboarding.js). The row is always
           visible, so the control is reachable from every tool screen. -->
      <div class="flex h-16 shrink-0 items-center gap-2 border-b border-sb-line px-5">
        <a href="/" data-nav
          class="text-heading tracking-widest text-sb-fg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus focus-visible:ring-offset-2 focus-visible:ring-offset-sb-bg">PIXORA</a>
        <button id="guide-btn-sidebar" type="button" data-guide-open aria-label="Show the getting-started guide"
          class="btn-secondary ml-auto min-w-11 bg-sb-raised px-3 text-sb-fg">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.1 9a3 3 0 1 1 4.2 2.7c-.8.4-1.3 1-1.3 1.9v.4"/>
            <circle cx="12" cy="17.5" r="1"/>
          </svg>
        </button>
      </div>
      <nav id="nav" aria-label="Tools" class="flex flex-1 flex-col gap-1 overflow-y-auto p-3"></nav>
      <p class="shrink-0 border-t border-sb-line px-5 py-4 text-small text-sb-muted">AI toolkit for microstock creators</p>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <!-- Light main area. On phones the sidebar collapses into this header. -->
      <header class="sticky top-0 z-20 flex h-14 items-center gap-3 border-b border-line bg-surface px-4 md:hidden">
        <button id="menu-btn" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="Open the menu"
          class="btn-secondary px-3">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
          </svg>
        </button>
        <span class="text-heading tracking-widest">PIXORA</span>
        <button id="guide-btn-header" type="button" data-guide-open aria-label="Show the getting-started guide"
          class="btn-secondary ml-auto min-w-11 px-3">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.1 9a3 3 0 1 1 4.2 2.7c-.8.4-1.3 1-1.3 1.9v.4"/>
            <circle cx="12" cy="17.5" r="1"/>
          </svg>
        </button>
      </header>

      <main id="view" class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 md:px-8 md:py-10">
        <!-- First-run guide. Real markup, so it paints with the rest of the
             shell, and `hidden` so a returning visitor never sees it flash
             before public/js/onboarding.js reads the pixora:onboarded flag:
             the guide is for a first visit to an empty app, so the heading is
             this screen's h1. It is the home empty state, so it lives on the
             home route only. -->
        <section id="onboarding" data-onboarding hidden aria-labelledby="onboarding-heading"
          class="card flex flex-col gap-4">
          <div class="flex flex-col gap-2">
            <h1 id="onboarding-heading" class="text-title">Convert images in your browser</h1>
            <p class="text-body text-muted">Nothing is uploaded. Files never leave your device.</p>
          </div>

          <!-- The dropzone every tool already shows: a real <button> so the
               keyboard reaches it, wrapping a visually hidden file input it
               activates. Choosing files hands them to the current tool
               through the same contract as an upload. -->
          <div class="flex flex-col gap-2">
            <input id="onboarding-file" tabindex="-1" type="file" multiple accept="image/png,image/jpeg,image/webp" class="sr-only">
            <button id="onboarding-dropzone" type="button"
              class="flex min-h-40 w-full flex-col items-center justify-center gap-2 rounded-lg border-2 border-dashed border-line bg-ground px-4 py-6 text-center hover:bg-raised focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus">
              <svg class="h-6 w-6 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              <span class="text-body font-medium">Click to upload or drag an image here</span>
              <span class="block text-small text-muted">PNG, JPEG or WebP up to 10 MB</span>
            </button>
          </div>

          <ol class="flex flex-col gap-3">
            <li class="flex items-center gap-3">
              <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-accent text-small font-medium text-on-accent">1</span>
              <span class="text-body">Add your images</span>
            </li>
            <li class="flex items-center gap-3">
              <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-accent text-small font-medium text-on-accent">2</span>
              <span class="text-body">Choose a format and a size</span>
            </li>
            <li class="flex items-center gap-3">
              <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-accent text-small font-medium text-on-accent">3</span>
              <span class="text-body">Download them one by one, or all together as one .zip</span>
            </li>
          </ol>

          <div class="flex flex-wrap items-center gap-2">
            <button id="onboarding-sample" type="button" class="btn-primary">Try a sample</button>
            <button id="onboarding-dismiss" type="button" class="btn-secondary">Got it</button>
          </div>

          <!-- The polite status line: "Converting your sample", then
               "1 of 1 done". Never an alert, so it cannot interrupt. -->
          <p id="onboarding-status" role="status" aria-live="polite" class="text-small text-muted">Ready when you are</p>
        </section>

        <!-- Routed content: the home cards and the tool workspaces render in
             here, so a route change never disturbs the guide above it. -->
        <div id="route" class="flex flex-col"></div>
      </main>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
